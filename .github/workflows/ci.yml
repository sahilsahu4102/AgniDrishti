name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      # Only what the tests import. The camera, Telegram and YOLO packages in requirements.txt are
      # left out: they are large and no test touches them. Versions are the pinned ones.
      - name: Install test dependencies
        run: |
          grep -E '^(pandas|numpy|requests|rasterio|pyproj|shapely|scikit-learn|fastapi)==' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt -r requirements-dev.txt
      - run: pytest
